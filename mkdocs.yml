site_name: ai-sdlc
site_description: AI-assisted software development lifecycle — one implementation, adopted by many repositories.
repo_url: https://github.com/derekwinters/ai-sdlc
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences

nav:
  - Home: index.md
  - Design: design.md
  - Adoption: adoption.md
  - House rules: house-rules.md
  - Specification:
      - Adoption: spec/adopt.md
      - Configuration: spec/configuration.md
      - Distribution: spec/distribution.md
      - Profiles: spec/profiles.md
      - House rules: spec/house-rules.md
      - Pull request hygiene: spec/hygiene.md
      - Release flow: spec/release.md
      - GitHub access: spec/github-api.md
      - Consistency: spec/validators.md
      - Gatekeeper: spec/gatekeeper.md
      - Blockers: spec/blockers.md
      - CI watch: spec/ci-watch.md
      - Dashboard: spec/dashboard.md
      - Development queue: spec/development.md
      - Labels: spec/labels.md
      - Milestones: spec/milestones.md
      - Triage: spec/triage.md
  - Decisions:
      - Migration plan: decisions/migration-plan.md

# The version selector in the header. Without a provider the versions
# exist on gh-pages but nobody can switch between them.
extra:
  version:
    provider: mike
