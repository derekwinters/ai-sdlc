name: docs-gate

# A pull request that changes code should change documentation too — or say
# deliberately that it needs none. The `skip-docs` label makes this check PASS,
# never skip: a skipped required check stays pending and blocks the merge.

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  docs-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - if: inputs.ref != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: derekwinters/ai-sdlc
          ref: ${{ inputs.ref }}
          path: .ai-sdlc

      - name: Require documentation to be reconciled
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          SKILL_ROOT: ${{ inputs.ref != '' && '.ai-sdlc' || '.' }}
        run: |
          git diff --name-only "$BASE" "$HEAD" | python3 \
            "$SKILL_ROOT/skills/mkdocs/docs-gate/check_docs_changed.py"
