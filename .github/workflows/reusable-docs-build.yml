name: docs-build

# The mkdocs profile's strict documentation build, as a pull request check.
#
# Strict mode is the point: a warning is a broken link, and a broken link is a
# broken page. A warning nobody sees is a broken page shipped.
#
# This workflow builds and stops. It does not publish, and a consumer adopting
# the profile does not get a publisher — publishing is the most
# repository-specific thing there is (Pages or a branch, versioned or not,
# which alias scheme), and installing a second one underneath a repository's
# working publisher is not a migration (#100). `mkdocs build --strict` is
# identical everywhere; only the requirements path varies, and that is an
# input.

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      requirements:
        description: Where the documentation dependencies are listed.
        type: string
        default: docs/requirements.txt

permissions:
  contents: read

concurrency:
  group: docs-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ inputs.requirements }}

      - run: pip install -r ${{ inputs.requirements }}

      - name: Build the site (strict)
        run: mkdocs build --strict
