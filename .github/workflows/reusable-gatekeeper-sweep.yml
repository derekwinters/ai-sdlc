name: gatekeeper-sweep

# The backstop. Firing is a poke, and a poke can be lost — a routine that never
# starts leaves the issue in `ai-triage-running` with nothing that will ever
# look at it again. This notices those and relabels them `ai-triage-stalled`.
#
# It starts no sessions. Deciding to spend another one is a person's job, done
# with `/admit`. That is why this workflow needs no ceiling, no per-issue
# budget, and no fire secrets: whatever it gets wrong, it writes a label.
#
# See docs/spec/gatekeeper.md (GK-139 to GK-143).

on:
  workflow_call:
    inputs:
      ref:
        description: The ai-sdlc ref providing the handler.
        type: string
        default: main
      stale_after:
        description: >-
          Seconds a session may run before it counts as never having answered.
          Required rather than defaulted: a caller that omits it should fail
          loudly instead of inheriting a number nobody chose, and the number it
          does carry belongs in the repository it governs. `adopt` writes 1800.
        type: number
        required: true

permissions:
  contents: read
  issues: write

concurrency:
  # One at a time, never cancelled. Two concurrent sweeps would each read the
  # same board and write the same labels — harmless, but the second run's
  # report would describe work the first already did.
  group: gatekeeper-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch the handler
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: derekwinters/ai-sdlc
          ref: ${{ inputs.ref }}
          # Not `.ai-sdlc`: that is where the *consumer* keeps its committed
          # configuration, and checkout empties the directory it writes into.
          path: .ai-sdlc-checkout

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Sweep the board
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          STALE_AFTER: ${{ inputs.stale_after }}
          SKILL_ROOT: ${{ inputs.ref != '' && '.ai-sdlc-checkout' || '.' }}
        run: |
          PYTHONPATH="$SKILL_ROOT" python3 \
            "$SKILL_ROOT/skills/pipeline/pipeline-gatekeeper/main.py" sweep
