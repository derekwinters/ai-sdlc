name: gatekeeper-sweep

# The backstop. Firing is a poke, and a poke can be lost — a routine that never
# starts leaves the issue in triage with nothing that will ever look at it
# again. This finds those and pokes them once more.
#
# Two paths, and the difference between them is the point. The scheduled path
# may requeue. The event path may not: a merge or a label change can briefly
# make a healthy issue look stranded, and requeueing in that window is what
# turns two states into a loop that fires a session on every flip.
#
# What it may spend is bounded twice — `sweep.ceiling` per run, and
# `sweep.give_up_after` per issue across all runs. See docs/spec/gatekeeper.md
# (GK-138 to GK-144).

on:
  workflow_call:
    inputs:
      ref:
        description: The ai-sdlc ref providing the handler.
        type: string
        default: main
      events_only:
        description: >-
          True on the event path, where requeueing is withheld. The scheduled
          caller passes false.
        type: boolean
        default: true
    secrets:
      fire_endpoint:
        required: false
      fire_token:
        required: false

permissions:
  contents: read
  issues: read

concurrency:
  # One sweep at a time, and never cancelled: two concurrent sweeps would each
  # see the same stranded issues and poke them, which is the one thing the
  # ceiling cannot bound.
  group: gatekeeper-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch the handler
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: derekwinters/ai-sdlc
          ref: ${{ inputs.ref }}
          path: .ai-sdlc

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Sweep the board
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FIRE_ENDPOINT: ${{ secrets.fire_endpoint }}
          FIRE_TOKEN: ${{ secrets.fire_token }}
          EVENTS_ONLY: ${{ inputs.events_only }}
          SKILL_ROOT: ${{ inputs.ref != '' && '.ai-sdlc' || '.' }}
        run: |
          PYTHONPATH="$SKILL_ROOT" python3 \
            "$SKILL_ROOT/skills/pipeline/pipeline-gatekeeper/main.py" sweep
