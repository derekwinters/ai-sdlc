name: closing-keyword

# A required status check. It ALWAYS runs and always reports: a required check
# skipped by a workflow condition stays pending forever and blocks the merge it
# was meant to permit. The `no-closing-keyword` label makes it PASS, never skip.

on:
  workflow_call:
    inputs:
      ref:
        description: >-
          The ai-sdlc ref providing the check. Leave unset when ai-sdlc is
          itself the caller: the checkout below is skipped and the copy already
          in the workspace is used.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  closing-keyword:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fetch the check
        if: inputs.ref != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: derekwinters/ai-sdlc
          ref: ${{ inputs.ref }}
          # Not `.ai-sdlc`: that is where the *consumer* keeps its committed
          # configuration, and checkout empties the directory it writes into.
          path: .ai-sdlc-checkout

      - name: Require a closing keyword
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          SKILL_ROOT: ${{ inputs.ref != '' && '.ai-sdlc-checkout' || '.' }}
        run: |
          printf '%s' "$PR_BODY" | python3 \
            "$SKILL_ROOT/skills/hygiene/closing-keyword/check_closing_keyword.py"
