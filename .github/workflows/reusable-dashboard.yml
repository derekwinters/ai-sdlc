name: dashboard

# The pipeline's only scheduled job, and it writes to no issue but the
# dashboard's own body. A renderer that repairs things is a sweep by another
# name, and the sweep was removed on purpose.

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: dashboard
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - if: inputs.ref != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: derekwinters/ai-sdlc
          ref: ${{ inputs.ref }}
          # Not `.ai-sdlc`: that is where the *consumer* keeps its committed
          # configuration, and checkout empties the directory it writes into.
          path: .ai-sdlc-checkout

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Render the dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SKILL_ROOT: ${{ inputs.ref != '' && '.ai-sdlc-checkout' || '.' }}
        run: |
          PYTHONPATH="$SKILL_ROOT" python3 \
            "$SKILL_ROOT/skills/pipeline/pipeline-dashboard/main.py"
