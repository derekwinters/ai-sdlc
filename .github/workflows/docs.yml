name: docs

# The documentation site is a gate, not a byproduct: a change that leaves it
# unbuildable does not merge. Build on every pull request; publish only from
# main.
#
# Publishing is a push to the `gh-pages` branch rather than GitHub's artifact
# pipeline. That is three fewer third-party actions, which matters here because
# this repository requires actions to be SHA-pinned and the policy reaches
# *inside* composite actions — `upload-pages-artifact@v3` calls
# `actions/upload-artifact@v4` unpinned in its own action.yml, and the step was
# refused before it ran (#64). A branch push has no such surface, and needs
# `contents: write` instead of `pages: write` plus an OIDC token exchange.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      # Enough to push gh-pages, and nothing else.
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # gh-deploy needs the branch history it is about to add a commit to.
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - run: pip install -r docs/requirements.txt

      # Strict: a broken link or a page missing from the nav is a failure, not
      # a warning. This runs on every pull request, and it runs here — before
      # any publish — so a broken site cannot reach gh-pages.
      - name: Build the site (strict)
        run: mkdocs build --strict

      - name: Publish to gh-pages
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force --no-history
