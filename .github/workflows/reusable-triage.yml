name: triage

# Fires the analysis routine when an issue enters triage.
#
# The single trigger. The gatekeeper used to fire this, which meant the
# routine was reachable only through `/admit` and only at the instant of the
# transition — labelling an issue by hand poked nothing at all. Keyed on the
# label event instead, so "the issue entered triage" fires exactly once
# however the label got there.
#
# Writes nothing. Firing is a poke; what happens next is the routine's
# decision, and a workflow that also moved labels would be a second
# gatekeeper.

on:
  workflow_call:
    inputs:
      ref:
        description: The ai-sdlc ref providing the handler.
        type: string
        default: main
    secrets:
      fire_endpoint:
        required: false
      fire_token:
        required: false

permissions:
  contents: read

concurrency:
  # Per issue: two label events on one issue would fire twice for the same
  # transition. Different issues are independent.
  group: triage-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch the handler
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: derekwinters/ai-sdlc
          ref: ${{ inputs.ref }}
          path: .ai-sdlc

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Fire the analysis routine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FIRE_ENDPOINT: ${{ secrets.fire_endpoint }}
          FIRE_TOKEN: ${{ secrets.fire_token }}
          SKILL_ROOT: ${{ inputs.ref != '' && '.ai-sdlc' || '.' }}
        run: |
          PYTHONPATH="$SKILL_ROOT" python3 \
            "$SKILL_ROOT/skills/pipeline/pipeline-gatekeeper/main.py" labeled
