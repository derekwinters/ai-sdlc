name: triage

# Fires the analysis routine for a label this repository's gatekeeper did not
# apply itself — a hand on the web UI, an app, anything added later. Before
# this existed the routine was reachable only through `/admit`, so labelling
# an issue by hand poked nothing at all.
#
# The gatekeeper fires for its own moves and the two cannot collide: it writes
# with GITHUB_TOKEN, and GitHub starts no workflow run from an event that
# token authored, so its own label move never reaches this workflow. See the
# invariant on GK-122 before giving the gatekeeper a different token.
#
# Writes the pending marker and nothing else. Firing is a poke; what happens
# next is the routine's decision, and a workflow that also moved pipeline
# states would be a second gatekeeper.

on:
  workflow_call:
    inputs:
      ref:
        description: The ai-sdlc ref providing the handler.
        type: string
        default: main
    secrets:
      fire_endpoint:
        required: false
      fire_token:
        required: false

# `issues: write` is for the pending marker (GK-138) and nothing else — never a
# pipeline state, which stays the routine's decision (GK-122). Safe to write
# from here: it is written with GITHUB_TOKEN, so it starts no workflow run, and
# it is not the triage label, so this caller's own `if:` would drop it anyway.
permissions:
  contents: read
  issues: write

concurrency:
  # Per issue: two label events on one issue would fire twice for the same
  # transition. Different issues are independent.
  group: triage-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch the handler
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: derekwinters/ai-sdlc
          ref: ${{ inputs.ref }}
          path: .ai-sdlc

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Fire the analysis routine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FIRE_ENDPOINT: ${{ secrets.fire_endpoint }}
          FIRE_TOKEN: ${{ secrets.fire_token }}
          SKILL_ROOT: ${{ inputs.ref != '' && '.ai-sdlc' || '.' }}
        run: |
          PYTHONPATH="$SKILL_ROOT" python3 \
            "$SKILL_ROOT/skills/pipeline/pipeline-gatekeeper/main.py" labeled
