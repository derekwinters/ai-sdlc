name: closing-keyword
description: >-
  Require a pull request to close exactly one issue with a real keyword, or to
  carry the label that deliberately says it closes none.

# An action rather than a reusable workflow, so nothing is checked out into the
# consumer's workspace. The runner fetches this repository into its own action
# directory before any step runs; `$GITHUB_ACTION_PATH` is this folder inside
# it, and the whole repository is present around it.
#
# The consumer's own tree is never touched, and does not even need checking out:
# everything this reads comes from the event.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12"

    - name: Require a closing keyword
      shell: bash
      env:
        PR_BODY: ${{ github.event.pull_request.body }}
        PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
      # `../../..` is the repository root: this file is at
      # `.github/actions/<name>/action.yml`. Asserted by test, because a moved
      # script would otherwise fail in a consumer's run rather than in ours.
      run: |
        printf '%s' "$PR_BODY" | python3 \
          "$GITHUB_ACTION_PATH/../../../skills/hygiene/closing-keyword/check_closing_keyword.py"
