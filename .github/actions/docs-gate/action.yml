name: docs-gate
description: >-
  Require a pull request that changes code to change documentation too, or to
  carry the label that says deliberately that it needs none.

# An action rather than a reusable workflow, so nothing is checked out into the
# consumer's workspace. The runner fetches this repository into its own action
# directory before any step runs; `$GITHUB_ACTION_PATH` is this folder inside
# it, and the whole repository is present around it.

runs:
  using: composite
  steps:
    # This gate reads the *consumer's* history, so it checks the consumer out
    # itself rather than requiring the caller to. `fetch-depth: 0` is not
    # optional — the diff is between two commits that a shallow clone does not
    # both contain, and a caller that got this wrong would produce a confident
    # wrong verdict rather than an error.
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        fetch-depth: 0

    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12"

    - name: Require documentation to be reconciled
      shell: bash
      env:
        PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        BASE: ${{ github.event.pull_request.base.sha }}
        HEAD: ${{ github.event.pull_request.head.sha }}
      # `../../..` is the repository root: this file is at
      # `.github/actions/<name>/action.yml`. Asserted by test, because a moved
      # script would otherwise fail in a consumer's run rather than in ours.
      run: |
        git diff --name-only "$BASE" "$HEAD" | python3 \
          "$GITHUB_ACTION_PATH/../../../skills/mkdocs/docs-gate/check_docs_changed.py"
