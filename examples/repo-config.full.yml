# Save this as `.ai-sdlc/repo-config.yml` in the consuming repository.
# A repository running the whole pipeline, with the unity profile.
capabilities:
  - hygiene
  - consistency
  - labels
  - release
  - pipeline

profiles:
  - unity

owners:
  - derekwinters

bot:
  identity: github-actions

milestone_ordering: semver
dashboard_issue: 193

# Only the states this repository renames; the rest keep their defaults.
labels:
  approved: ready-for-work
  building: in-progress

commands:
  test: dotnet test Tests/Core/Core.Tests.csproj
  verify: ./scripts/validate-specs.sh

fire:
  endpoint_secret: ROUTINE_FIRE_URL
  token_secret: ROUTINE_FIRE_TOKEN

# The ai-sdlc skills installed here, kept at the pinned version by
# `skills-update.yml`. This repository's list, not a central registry's — a
# registry deciding what a repository should have is what reverted local work
# the last two times a skill sync was built. `adopt` seeds this key **once**, if
# it is absent entirely, from your capabilities — and never touches it again.
# Prune it, add to it, or write `skills: []` to install none; whatever is here
# is what the next adoption honours.
#
# What belongs here is what something *in this repository* invokes. Skills that
# only ever execute from ai-sdlc's own tree inside an action or workflow —
# `pipeline-gatekeeper`, `pipeline-dashboard`, `label-sync`, `closing-keyword`,
# `docs-gate` — do not: a copy here is a second version nothing reads.
#
# `adopt` is absent for a different reason: it is a script, run from an ai-sdlc
# checkout, and an installed copy would import `lib` and raise
# ModuleNotFoundError.
skills:
  - github-api
  - triage-issue
  - pipeline-dev
  - issue-blockers
  - ci-watch
  - milestone-ops
  - release-flow

