# A repository running the whole pipeline, with the unity profile.
capabilities:
  - hygiene
  - consistency
  - labels
  - release
  - pipeline

profiles:
  - unity

owners:
  - derekwinters

bot:
  identity: github-actions

milestone_ordering: semver
dashboard_issue: 193

# Only the states this repository renames; the rest keep their defaults.
labels:
  approved: ready-for-work
  building: in-progress

commands:
  test: dotnet test Tests/Core/Core.Tests.csproj
  verify: ./scripts/validate-specs.sh

fire:
  endpoint_secret: ROUTINE_FIRE_URL
  token_secret: ROUTINE_FIRE_TOKEN

# What the scheduled backstop may spend. A circuit breaker, not a throttle:
# the ceiling is set well above what an ordinary board strands at once, so
# reaching it means something is wrong rather than busy. How many times one
# issue may be poked is bounded by the attempt-marker labels instead of by a
# duration — a duration is measured against a clock ordinary activity resets.
sweep:
  ceiling: 20
  stale_after: 1800
