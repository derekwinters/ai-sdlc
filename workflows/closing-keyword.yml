name: closing-keyword

# A required status check. It ALWAYS runs and always reports: a required check
# skipped by a workflow condition stays pending forever and blocks the merge it
# was meant to permit. The `no-closing-keyword` label makes it PASS, never skip.

on:
  workflow_call:
    inputs:
      ref:
        description: The ai-sdlc ref providing the check.
        type: string
        default: main

permissions:
  contents: read

jobs:
  closing-keyword:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the check
        uses: actions/checkout@v4
        with:
          repository: derekwinters/ai-sdlc
          ref: ${{ inputs.ref }}
          path: .ai-sdlc

      - name: Require a closing keyword
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          printf '%s' "$PR_BODY" | python3 \
            .ai-sdlc/skills/hygiene/closing-keyword/check_closing_keyword.py
